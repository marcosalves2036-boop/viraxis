name: Keep-alive Render + Supabase

# Evita que o backend Render (free tier) durma por inatividade (~cold start de
# 42s) e que o projeto Supabase (free tier) seja pausado por inatividade
# (o que derruba o Storage com DNS NXDOMAIN ate restauracao manual).
# Roda a cada 10 minutos fazendo requisicoes leves de "ping" nos dois servicos.
#
# Nota: a chave usada abaixo e a Supabase "anon key" (role=anon), publica por
# design (protegida por RLS no banco) — e a mesma chave ja embutida no bundle
# do frontend. Nao usar a service_role key aqui.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  keepalive:
    name: Ping Render + Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (/health)
        run: |
          echo "Chamando https://viraxis.onrender.com/health ..."
          HTTP_CODE=$(curl -s -o /tmp/render_health.json -w "%{http_code}" \
            --max-time 60 \
            "https://viraxis.onrender.com/health")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/render_health.json || true
          echo ""
          # /health agora checa conectividade real com Neon (SELECT 1) e Supabase
          # Storage, devolvendo status=degraded + HTTP 503 quando alguma dependencia
          # falha (em vez de sempre 200 estatico). Antes desta mudanca este step so
          # emitia ::warning:: e sempre saia com exit 0 — o Supabase ficou INACTIVE
          # num ciclo anterior e isso passou despercebido porque nenhum workflow
          # falhava. Agora qualquer resposta != 200 falha o job (exit 1), que aciona
          # a notificacao padrao do GitHub Actions de workflow quebrado.
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Render /health respondeu HTTP $HTTP_CODE (esperado 200) - servico ou dependencia (Neon/Supabase Storage) pode estar fora do ar"
            exit 1
          fi

      - name: Ping Supabase REST API
        run: |
          echo "Chamando https://txixslihsadojhqhclpr.supabase.co/rest/v1/ ..."
          HTTP_CODE=$(curl -s -o /tmp/supabase_ping.json -w "%{http_code}" \
            --max-time 60 \
            "https://txixslihsadojhqhclpr.supabase.co/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/supabase_ping.json || true
          echo ""
          # 200 = OK. 404 tambem e aceitavel aqui (raiz do PostgREST sem rota
          # explicita ainda responde e mantem o projeto ativo). O que importa
          # e que NAO seja erro de rede/DNS (curl retornaria HTTP_CODE=000)
          # ou 5xx, que indicariam o projeto pausado/inacessivel.
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 500 ]; then
            echo "::warning::Supabase REST respondeu HTTP $HTTP_CODE - projeto pode estar pausado/inacessivel"
            exit 1
          fi
